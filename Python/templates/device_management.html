<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>


        tbody tr:hover {
            background-color: #f1f1f1;
        }

        .header-section {
            background-image: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            padding: 1rem 0;
            text-align: center;
        }

        .header-section h1 {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }

    </style>
</head>
<body>
<header class="header-section">
    <h1>Quản lý thiết bị</h1>
</header>
<div class="container my-5">


    <!-- Nút thêm mới thiết bị -->
    <div class="text-end mb-3">
        <button class="btn btn-success" onclick="addDevice()">Thêm mới thiết bị</button>
    </div>

    <!-- Bảng hiển thị danh sách thiết bị -->
    <table class="table table-bordered text-center">
        <thead class="table-success">
        <tr>
            <th>STT</th>
            <th>Tên thiết bị</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody id="deviceTableBody">
        <!-- Dữ liệu được thêm động -->
        </tbody>
    </table>

    <!-- Nút quay lại -->
    <div class="text-start">
        <button class="btn btn-secondary" onclick="goBack()">Quay lại</button>
    </div>
</div>

<script>
    // Load danh sách thiết bị từ API
    function loadDevices() {
        fetch('http://192.168.85.239:5000/devices')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('deviceTableBody');
                tableBody.innerHTML = '';

                data.devices.forEach((device, index) => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${device.name}</td>
                            <td>${device.status}</td>
                            <td>
                                <button class="btn btn-warning btn-sm me-1" onclick="editDevice(${device.id})">Sửa</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteDevice(${device.id})">Xóa</button>
                            </td>
                        `;

                    tableBody.appendChild(row);
                });
            })
            .catch(error => console.error('Error:', error));
    }

    // Thêm mới thiết bị
    function addDevice() {
        const name = prompt("Nhập tên thiết bị:");
        const status = prompt("Nhập trạng thái thiết bị (active/inactive):");

        if (name && status) {
            fetch('http://192.168.85.239:5000/device', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({name, status})
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    loadDevices();
                })
                .catch(error => console.error('Error:', error));
        }
    }

    // Sửa thiết bị
    function editDevice(id) {
        const name = prompt("Nhập tên mới cho thiết bị:");
        const status = prompt("Nhập trạng thái mới cho thiết bị (active/inactive):");

        if (name && status) {
            fetch(`http://192.168.85.239:5000/device/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({name, status})
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    loadDevices();
                })
                .catch(error => console.error('Error:', error));
        }
    }

    // Xóa thiết bị
    function deleteDevice(id) {
        if (confirm("Bạn có chắc chắn muốn xóa thiết bị này?")) {
            fetch(`http://192.168.85.239:5000/device/${id}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    loadDevices();
                })
                .catch(error => console.error('Error:', error));
        }
    }

    // Quay lại trang chính
    function goBack() {
        window.location.href = 'main.html';
    }

    // Load danh sách thiết bị khi trang được tải
    document.addEventListener('DOMContentLoaded', loadDevices);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
