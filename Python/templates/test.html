<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Test</title>
</head>
<body>
    <h2>Login to API</h2>
    <form id="loginForm">
        <label>Username:</label>
        <input type="text" id="username" value="phamtu" readonly><br><br>

        <label>Password:</label>
        <input type="password" id="password"><br><br>

        <button type="submit">Login</button>
    </form>

    <div id="result" style="margin-top:20px;"></div>

    <script>
        const form = document.getElementById("loginForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const url = `http://localhost:8080/api/users/auth/login?username=${username}&password=${encodeURIComponent(password)}`;

            try {
                const response = await fetch(url, {
                    method: "POST"
                });

                const data = await response.text(); // assuming it returns a string or token

                if (response.ok) {
                    result.innerHTML = `<strong>Success:</strong> ${data}`;
                } else {
                    result.innerHTML = `<strong style="color:red;">Error:</strong> ${data}`;
                }
            } catch (error) {
                result.innerHTML = `<strong style="color:red;">Fetch failed:</strong> ${error}`;
            }
        });
    </script>
</body>
</html>
